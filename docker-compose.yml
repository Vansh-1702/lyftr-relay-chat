services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  sqlite_data:
